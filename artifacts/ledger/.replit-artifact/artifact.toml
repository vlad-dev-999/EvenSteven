kind = "web"
previewPath = "/"
title = "Ledger"
description = "A self-hosted collaborative expense settlement PWA for small social events. Friends and families join shared events via a secure link, record expenses with category and split options (everyone, families, or members), and the app computes minimum-transfer settlements. Features dark-mode-first UI, host approval flows, event freeze, activity logs, and installable PWA support."
version = "1.0.0"
id = "artifacts/ledger"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21356

[services.development]
run = "pnpm --filter @workspace/ledger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ledger", "run", "build" ]
serve = "static"
publicDir = "artifacts/ledger/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21356"
BASE_PATH = "/"
