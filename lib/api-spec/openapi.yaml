openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: EvenSteven - Collaborative expense settlement API

servers:
  - url: /api
    description: Base API path

tags:
  - name: health
    description: Health operations
  - name: host
    description: Host console authentication
  - name: houses
    description: Permanent house directory
  - name: people
    description: Permanent people directory
  - name: events
    description: Event management
  - name: members
    description: Member management
  - name: families
    description: Event-level house group management
  - name: expenses
    description: Expense management
  - name: join-requests
    description: Join request management
  - name: settlements
    description: Balance and settlement calculations
  - name: activity
    description: Timeline / activity log

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Host auth ──────────────────────────────────────────────────────────────

  /host/auth:
    post:
      operationId: hostAuth
      tags: [host]
      summary: Exchange HOST_PASSWORD for a host token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostAuthInput"
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostAuthResult"
        "401":
          description: Incorrect password

  /host/auth/check:
    get:
      operationId: checkHostAuth
      tags: [host]
      summary: Verify an existing host token
      parameters:
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostAuthCheck"

  # ── Houses ────────────────────────────────────────────────────────────────

  /houses:
    get:
      operationId: listHouses
      tags: [houses]
      summary: List all houses
      responses:
        "200":
          description: Houses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/House"
    post:
      operationId: createHouse
      tags: [houses]
      summary: Create a house (host only)
      parameters:
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseInput"
      responses:
        "201":
          description: House created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"

  /houses/{id}:
    patch:
      operationId: updateHouse
      tags: [houses]
      summary: Update a house (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseInput"
      responses:
        "200":
          description: House updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/House"
        "404":
          description: House not found
    delete:
      operationId: deleteHouse
      tags: [houses]
      summary: Delete a house (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: House not found

  # ── People ────────────────────────────────────────────────────────────────

  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List all people with house info
      responses:
        "200":
          description: People list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Create a person (host only)
      parameters:
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Person created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{id}/pin:
    post:
      operationId: resetPersonPin
      tags: [people]
      summary: Generate or reset a person's personal PIN (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New PIN (plaintext, shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPinResult"
        "404":
          description: Person not found

  /people/{id}:
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update a person (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "200":
          description: Person updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Person not found
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Person not found

  # ── Events ────────────────────────────────────────────────────────────────

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all events (host only)
      parameters:
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Events list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a new event (host only)
      parameters:
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCreated"

  /events/{token}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get event details
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Event not found

  /events/{token}/identity-options:
    get:
      operationId: getIdentityOptions
      tags: [events]
      summary: Get houses and their members for identity selection
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Identity options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityOptions"
        "404":
          description: Event not found

  /events/{token}/identify:
    post:
      operationId: identifyMember
      tags: [events]
      summary: Claim identity or verify personal PIN
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyInput"
      responses:
        "200":
          description: Identity confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyResult"
        "401":
          description: Incorrect personal PIN
        "409":
          description: Identity already claimed, PIN required

  /events/{token}/session:
    post:
      operationId: setSession
      tags: [events]
      summary: Authenticate as a member (legacy)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "200":
          description: Session set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid PIN or member not found
    get:
      operationId: getSession
      tags: [events]
      summary: Get current member session
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResult"

  /events/{token}/freeze:
    post:
      operationId: freezeEvent
      tags: [events]
      summary: Freeze event (host only)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{token}/unfreeze:
    post:
      operationId: unfreezeEvent
      tags: [events]
      summary: Unfreeze event (host only)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event unfrozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{token}/summary:
    get:
      operationId: getEventSummary
      tags: [events]
      summary: Get event statistics
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSummary"

  # ── Members ───────────────────────────────────────────────────────────────

  /events/{token}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all members of an event
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: addAttendee
      tags: [members]
      summary: Add a directory person as an attendee (host only)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: x-host-token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttendeeInput"
      responses:
        "201":
          description: Attendee added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Person is already an attendee or inactive
        "404":
          description: Event or person not found

  /events/{token}/members/{memberId}:
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (host only)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member removed
        "400":
          description: Cannot remove host
        "404":
          description: Member not found

  # ── Families ──────────────────────────────────────────────────────────────

  /events/{token}/families:
    get:
      operationId: listFamilies
      tags: [families]
      summary: List all families (house groups) in an event
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Families list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Family"
    post:
      operationId: createFamily
      tags: [families]
      summary: Create a family group
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FamilyInput"
      responses:
        "201":
          description: Family created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Family"

  /events/{token}/families/{familyId}:
    delete:
      operationId: deleteFamily
      tags: [families]
      summary: Delete a family group
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Family deleted

  # ── Join requests ─────────────────────────────────────────────────────────

  /events/{token}/join-requests:
    get:
      operationId: listJoinRequests
      tags: [join-requests]
      summary: List join requests
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Join requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"
    post:
      operationId: createJoinRequest
      tags: [join-requests]
      summary: Submit a join request
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestInput"
      responses:
        "200":
          description: Join request submitted or matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequestResult"

  /events/{token}/join-requests/{requestId}:
    patch:
      operationId: updateJoinRequest
      tags: [join-requests]
      summary: Approve or reject a join request
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"

  # ── Expenses ──────────────────────────────────────────────────────────────

  /events/{token}/expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List all expenses in an event
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expenses list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Add an expense
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /events/{token}/expenses/{expenseId}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: expenseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: expenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Settlements ───────────────────────────────────────────────────────────

  /events/{token}/balances:
    get:
      operationId: getBalances
      tags: [settlements]
      summary: Get net balance for each member
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSummary"

  /events/{token}/settlements:
    get:
      operationId: getSettlements
      tags: [settlements]
      summary: Get minimum-transfer settlement plan
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Settlement transfers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Settlement"

  /events/{token}/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Get timeline / activity log
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

components:
  schemas:

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Host ──────────────────────────────────────────────────────────────

    HostAuthInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1

    HostAuthResult:
      type: object
      required: [token]
      properties:
        token:
          type: string

    HostAuthCheck:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    # ── Houses ────────────────────────────────────────────────────────────

    House:
      type: object
      required: [id, name, crest, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        crest:
          type: string
        accentColor:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    HouseInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        crest:
          type: string
        accentColor:
          type: string
          nullable: true

    # ── People ────────────────────────────────────────────────────────────

    Person:
      type: object
      required: [id, name, houseId, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        houseId:
          type: integer
        houseName:
          type: string
          nullable: true
        houseCrest:
          type: string
          nullable: true
        houseAccentColor:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PersonPinResult:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          description: Plaintext PIN shown once

    PersonInput:
      type: object
      required: [name, houseId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        houseId:
          type: integer
        avatar:
          type: string
          nullable: true
        active:
          type: boolean

    # ── Events ────────────────────────────────────────────────────────────

    Event:
      type: object
      required: [id, name, token, frozen, memberCount, totalExpenses, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        token:
          type: string
        frozen:
          type: boolean
        memberCount:
          type: integer
        totalExpenses:
          type: integer
        createdAt:
          type: string
          format: date-time
        bannerImage:
          type: string
          nullable: true
        tonightNoteTitle:
          type: string
          nullable: true
        tonightNoteBody:
          type: string
          nullable: true
          maxLength: 300
        hostMemberName:
          type: string
          nullable: true

    EventInput:
      type: object
      required: [name, hostPersonId, attendeePersonIds]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        hostPersonId:
          type: integer
        attendeePersonIds:
          type: array
          items:
            type: integer
          minItems: 1

    EventCreated:
      type: object
      required: [event, pin, hostMember]
      properties:
        event:
          $ref: "#/components/schemas/Event"
        pin:
          type: string
          description: 4-digit PIN for sharing
        hostMember:
          $ref: "#/components/schemas/Member"

    IdentityOptions:
      type: object
      required: [eventName, eventPin, houses]
      properties:
        eventName:
          type: string
        eventPin:
          type: string
        houses:
          type: array
          items:
            $ref: "#/components/schemas/IdentityHouse"

    IdentityHouse:
      type: object
      required: [id, name, crest, members]
      properties:
        id:
          type: integer
        name:
          type: string
        crest:
          type: string
        accentColor:
          type: string
          nullable: true
        members:
          type: array
          items:
            $ref: "#/components/schemas/IdentityMember"

    IdentityMember:
      type: object
      required: [id, name, claimed, isHost]
      properties:
        id:
          type: integer
        name:
          type: string
        claimed:
          type: boolean
        avatar:
          type: string
          nullable: true
        isHost:
          type: boolean

    IdentifyInput:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: integer
        personalPin:
          type: string
          nullable: true

    IdentifyResult:
      type: object
      required: [memberId, memberName, isHost]
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        isHost:
          type: boolean
        personalPin:
          type: string
          nullable: true
          description: Returned only on first claim

    # ── Members ───────────────────────────────────────────────────────────


    AddAttendeeInput:
      type: object
      required: [personId]
      properties:
        personId:
          type: integer

    Member:
      type: object
      required: [id, eventId, name, isHost, approved, claimed, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        personId:
          type: integer
          nullable: true
          description: Directory person ID, if this member was seeded from the directory
        name:
          type: string
        familyId:
          type: integer
          nullable: true
        familyName:
          type: string
          nullable: true
        houseId:
          type: integer
          nullable: true
        houseName:
          type: string
          nullable: true
        houseCrest:
          type: string
          nullable: true
        houseAccentColor:
          type: string
          nullable: true
        isHost:
          type: boolean
        approved:
          type: boolean
        claimed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    SessionInput:
      type: object
      required: [memberId, pin]
      properties:
        memberId:
          type: integer
        pin:
          type: string

    SessionResult:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        memberId:
          type: integer
        memberName:
          type: string
        isHost:
          type: boolean

    # ── Families ──────────────────────────────────────────────────────────

    Family:
      type: object
      required: [id, eventId, name, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    FamilyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    # ── Join requests ─────────────────────────────────────────────────────

    JoinRequest:
      type: object
      required: [id, eventId, name, status, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string
          format: date-time

    JoinRequestInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100

    JoinRequestResult:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [new_request, existing_member]
        joinRequest:
          $ref: "#/components/schemas/JoinRequest"
        member:
          $ref: "#/components/schemas/Member"

    JoinRequestUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected]

    # ── Expenses ──────────────────────────────────────────────────────────

    Expense:
      type: object
      required: [id, eventId, paidByMemberId, paidByMemberName, category, amount, splitType, participants, createdAt, updatedAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        paidByMemberId:
          type: integer
        paidByMemberName:
          type: string
        category:
          type: string
          enum: [tickets, food, drinks, snacks, fuel, other]
        amount:
          type: integer
          description: Amount in paise
        description:
          type: string
          nullable: true
        splitType:
          type: string
          enum: [everyone, families, members]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseParticipant"
        createdByMemberId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExpenseParticipant:
      type: object
      required: [memberId, memberName, shareAmount]
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        shareAmount:
          type: integer

    ExpenseInput:
      type: object
      required: [paidByMemberId, category, amount, splitType, createdByMemberId]
      properties:
        paidByMemberId:
          type: integer
        category:
          type: string
          enum: [tickets, food, drinks, snacks, fuel, other]
        amount:
          type: integer
          minimum: 1
        description:
          type: string
          nullable: true
        splitType:
          type: string
          enum: [everyone, families, members]
        participantIds:
          type: array
          items:
            type: integer
          nullable: true
        houseIds:
          type: array
          items:
            type: integer
          nullable: true
        createdByMemberId:
          type: integer

    # ── Settlements ───────────────────────────────────────────────────────

    BalanceSummary:
      type: object
      required: [totalExpenses, expenseCount, memberBalances]
      properties:
        totalExpenses:
          type: integer
        expenseCount:
          type: integer
        memberBalances:
          type: array
          items:
            $ref: "#/components/schemas/MemberBalance"

    MemberBalance:
      type: object
      required: [memberId, memberName, totalPaid, totalOwed, netBalance]
      properties:
        memberId:
          type: integer
        memberName:
          type: string
        totalPaid:
          type: integer
        totalOwed:
          type: integer
        netBalance:
          type: integer

    Settlement:
      type: object
      required: [fromMemberId, fromMemberName, toMemberId, toMemberName, amount]
      properties:
        fromMemberId:
          type: integer
        fromMemberName:
          type: string
        toMemberId:
          type: integer
        toMemberName:
          type: string
        amount:
          type: integer

    # ── Activity / Timeline ───────────────────────────────────────────────

    ActivityEntry:
      type: object
      required: [id, eventId, action, metadata, createdAt]
      properties:
        id:
          type: integer
        eventId:
          type: integer
        memberId:
          type: integer
          nullable: true
        memberName:
          type: string
          nullable: true
        action:
          type: string
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

    # ── Summary ───────────────────────────────────────────────────────────

    EventSummary:
      type: object
      required: [totalExpenses, expenseCount, memberCount, familyCount, categoryBreakdown, topPayers]
      properties:
        totalExpenses:
          type: integer
        expenseCount:
          type: integer
        memberCount:
          type: integer
        familyCount:
          type: integer
        categoryBreakdown:
          type: array
          items:
            type: object
            required: [category, total, count]
            properties:
              category:
                type: string
              total:
                type: integer
              count:
                type: integer
        topPayers:
          type: array
          items:
            type: object
            required: [memberId, memberName, totalPaid]
            properties:
              memberId:
                type: integer
              memberName:
                type: string
              totalPaid:
                type: integer
